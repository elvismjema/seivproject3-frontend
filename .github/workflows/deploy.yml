name: Deploy Frontend to AWS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Create production environment file
      run: |
        echo "VITE_APP_BASE_URL=${{ secrets.VITE_APP_BASE_URL }}" > .env
        echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env
        echo "VITE_APP_CLIENT_URL=${{ secrets.VITE_APP_CLIENT_URL }}" >> .env
        echo "VITE_APP_API_URL=${{ secrets.VITE_APP_API_URL }}" >> .env
        
    - name: Build application
      run: npm run build
      
    - name: Deploy to AWS EC2
      uses: easingthemes/ssh-deploy@main
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        ARGS: "-rltgoDzvO --delete"
        SOURCE: "dist/"
        REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        REMOTE_USER: ubuntu
        TARGET: "/var/www/html/seiv2025/p3/t2"
        
    - name: Set proper permissions
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ubuntu
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          sudo chmod -R 755 /var/www/html/seiv2025/p3/t2
          sudo chown -R nginx:nginx /var/www/html/seiv2025/p3/t2
          sudo systemctl reload nginx